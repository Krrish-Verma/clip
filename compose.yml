name: clip
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clip
      POSTGRES_USER: clip
      POSTGRES_PASSWORD: clip-local-only
    ports: ["5432:5432"]
    volumes: ["clip-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clip -d clip"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: clip-local
      MINIO_ROOT_PASSWORD: clip-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["clip-objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    volumes:
      - ./infra/minio/cors.json:/config/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 clip-local clip-local-only &&
        mc mb --ignore-existing local/clip &&
        mc anonymous set none local/clip &&
        mc cors set local/clip /config/cors.json

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment: &api-environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/clip
      DATABASE_USERNAME: clip
      DATABASE_PASSWORD: clip-local-only
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://127.0.0.1:3000,http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: clip
      S3_ACCESS_KEY: clip-local
      S3_SECRET_KEY: clip-local-only
      FRONTEND_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      WORKER_ENABLED: "false"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *api-environment
      WORKER_ENABLED: "true"
    command: ["java", "-jar", "/app/app.jar", "--server.port=8081"]

volumes:
  clip-postgres:
  clip-objects:
