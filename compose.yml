name: clip
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clip
      POSTGRES_USER: clip
      POSTGRES_PASSWORD: clip-local-only
    ports: ["5432:5432"]
    volumes: ["clip-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clip -d clip"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
    volumes:
      - clip-objects:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - ./infra/localstack/cors.json:/etc/localstack/init/cors.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    environment: &api-environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/clip
      DATABASE_USERNAME: clip
      DATABASE_PASSWORD: clip-local-only
      CLERK_ISSUER: ${CLERK_ISSUER:-https://unique-earwig-4470.clerk.accounts.dev}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://unique-earwig-4470.clerk.accounts.dev/.well-known/jwks.json}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://127.0.0.1:3000,http://localhost:3000}
      S3_ENDPOINT: http://localstack:4566
      S3_PRESIGN_ENDPOINT: http://localhost:4566
      S3_REGION: us-east-1
      S3_BUCKET: clip
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      FRONTEND_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      WORKER_ENABLED: "false"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *api-environment
      WORKER_ENABLED: "true"
    command: ["java", "-jar", "/app/app.jar", "--server.port=8081"]

volumes:
  clip-postgres:
  clip-objects:
