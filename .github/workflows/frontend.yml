name: Validate
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PLAYWRIGHT_CHANNEL: chromium

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x backend/mvnw
      - run: docker info
      - run: ./backend/mvnw -f backend/pom.xml test
      - name: Require PostgreSQL integration tests
        run: |
          python3 -c 'import xml.etree.ElementTree as ET; report = ET.parse("backend/target/surefire-reports/TEST-com.clip.integration.PostgresMigrationTest.xml").getroot(); assert int(report.attrib["tests"]) > 0 and int(report.attrib["skipped"]) == 0, report.attrib'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile transcriber/server.py
