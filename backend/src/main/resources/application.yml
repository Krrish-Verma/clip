spring:
  application:
    name: clip-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clip}
    username: ${DATABASE_USERNAME:clip}
    password: ${DATABASE_PASSWORD:clip-local-only}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
clip:
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:3000}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000}
  auth:
    issuer: ${CLERK_ISSUER:}
    jwk-set-uri: ${CLERK_JWKS_URL:}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:http://127.0.0.1:3000,http://localhost:3000}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${S3_PRESIGN_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:clip}
    access-key: ${S3_ACCESS_KEY:clip-local}
    secret-key: ${S3_SECRET_KEY:clip-local-only}
    upload-expiry: ${UPLOAD_URL_EXPIRY:15m}
    playback-expiry: ${PLAYBACK_URL_EXPIRY:15m}
  worker:
    enabled: ${WORKER_ENABLED:false}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    timeout: ${FFMPEG_TIMEOUT:15m}
  quotas:
    max-videos: ${MAX_VIDEOS_PER_USER:5}
    max-video-bytes: ${MAX_VIDEO_BYTES:209715200}
    max-storage-bytes: ${MAX_STORAGE_BYTES_PER_USER:1073741824}
    max-duration-seconds: ${MAX_VIDEO_DURATION_SECONDS:600}
